<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors Locations</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCIcPZzSIbQe6SsGBFHGX61-5wBbh03AGs" async defer></script>
    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Doctors Locations on Google Maps</h1>

    <div id="map"></div>

    <script>
        var map;
        var markers = [];

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 28.6139, lng: 77.2090 },  // Default center (Delhi)
                zoom: 12
            });

            var doctors = {{ doctors | safe }};
            doctors.forEach(function(doctor) {
                var marker = new google.maps.Marker({
                    position: { lat: doctor.latitude, lng: doctor.longitude },
                    map: map,
                    title: doctor.name
                });

                var infowindow = new google.maps.InfoWindow({
                    content: `<h3>${doctor.name}</h3><p>${doctor.address}</p>`
                });

                marker.addListener('click', function() {
                    infowindow.open(map, marker);
                });
            });
        }
    </script>
</body>
</html>

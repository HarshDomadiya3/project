<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <script>
        function validateForm(event) {
            event.preventDefault();

            let name = document.getElementById('id_name').value;
            let email = document.getElementById('id_email').value;
            let age = document.getElementById('id_age').value;
            let errors = [];

            if (!name) errors.push("Name is required.");
            if (!email.includes('@')) errors.push("Enter a valid email.");
            if (age < 1 || age > 100) errors.push("Age must be between 1 and 100.");

            const errorDiv = document.getElementById('errors');
            errorDiv.innerHTML = '';
            if (errors.length > 0) {
                errors.forEach(error => {
                    const p = document.createElement('p');
                    p.style.color = 'red';
                    p.innerText = error;
                    errorDiv.appendChild(p);
                });
            } else {
                document.getElementById('myForm').submit();
            }
        }
    </script>
</head>
<body>
    <h1>Fill the Form</h1>
    <div id="errors"></div>
    <form id="myForm" method="POST" onsubmit="validateForm(event)">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
</body>
</html>
